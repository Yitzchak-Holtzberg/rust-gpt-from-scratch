[workspace]
members = [".", "wasm-inference"]

[package]
name = "nano-gpt-rs"
version = "0.1.0"
edition = "2021"
description = "2M-parameter GPT from scratch in pure Rust"
authors = ["Yitzchak-Holtzberg"]

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.10"
candle-nn = "0.10"

# Server-only deps. Skipped when this crate is built for WASM through the
# `wasm-inference` workspace member.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit"] }

[profile.release]
opt-level = 3
