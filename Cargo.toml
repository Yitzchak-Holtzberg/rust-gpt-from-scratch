[workspace]
members = [".", "wasm-inference"]

[package]
name = "nano-gpt-rs"
version = "0.1.0"
edition = "2021"
description = "Educational GPT training and inference in Rust, with a hand-rolled tensor-engine history and Candle autograd"
authors = ["Yitzchak-Holtzberg"]

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "generate"
path = "src/bin/generate.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.10"
candle-nn = "0.10"

# Server-only deps. Skipped when this crate is built for WASM through the
# `wasm-inference` workspace member.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit"] }
# HuggingFace BPE / subword tokenizer. WASM build keeps the old CharTokenizer
# since `tokenizers` has heavy native deps that don't compile to wasm32.
tokenizers = "0.22"

[features]
default = []
# Enable with `cargo build --release --features cuda --bin serve`.
# Requires CUDA Toolkit 12.x installed (nvcc on PATH, CUDA_PATH env var set).
# Without this feature, the binary still runs — Device::new_cuda just errors
# at startup and we fall back to CPU.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[profile.release]
opt-level = 3
